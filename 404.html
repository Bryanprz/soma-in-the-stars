<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=/" />
    <script>
      (function () {
        var l = window.location
        var redirectTarget = l.pathname + l.search + l.hash
        window.sessionStorage.setItem('__gh_redirect__', redirectTarget)
      })()
    </script>
  </head>
  <body>
    <noscript>
      <p>
        JavaScript is required. <a href="/">Return to the home page</a>.
      </p>
    </noscript>
  </body>
</html>
